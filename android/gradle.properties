org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# Pinned to AGP 8.13.x below (pre-AGP-9), so these two flags are inert today.
# They exist as an explicit safety net: if Gradle/AGP ever auto-resolves to
# AGP 9+ (e.g. via a Flutter auto-migrator run), this keeps the OLD Gradle DSL
# and the explicit `kotlin-android` plugin working instead of silently
# switching to AGP 9's new declarative DSL / built-in Kotlin, which is what
# caused the "Starting AGP 9+, only the new DSL interface will be read" error.
# See: https://docs.flutter.dev/release/breaking-changes/migrate-to-agp-9
android.newDsl=false
android.builtInKotlin=false
