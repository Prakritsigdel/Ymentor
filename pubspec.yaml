name: ymentor
description: YMentor mentorship marketplace Flutter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1
  file_picker: ^8.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.4
  flutter_animate: ^4.5.0
  skeletonizer: ^1.4.0
  iconsax_plus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#03120D"
  adaptive_icon_foreground: assets/images/logo.png
  min_sdk_android: 21
