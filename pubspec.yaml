name: ymentor
description: Zero-Budget Micro-Mentorship Marketplace Flutter App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1
  file_picker: ^8.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  skeletonizer: ^1.4.0
  iconsax_plus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B0F12"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#0B0F12"
  image: "assets/icon/app_icon.png"
  
  # Android 12+ Splash Screen API Fix
  android_12:
    image: "assets/icon/app_icon.png"
    icon_background_color: "#0B0F12"
    color: "#0B0F12"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/icon/
